{% extends "base.html" %}
{% block title %}Registrar Equipo{% endblock %}
{% block content %}
<div class="container mt-5">
    <h1 class="mb-4 text-center">Registrar Nuevo Equipo</h1>

    <form method="post" action="/equipos/" enctype="multipart/form-data" class="col-md-6 offset-md-3 needs-validation" novalidate>

        <!-- Nombre -->
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del equipo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
            <div class="invalid-feedback">Por favor, ingresa el nombre del equipo.</div>
        </div>

        <!-- País -->
        <div class="mb-3">
            <label for="pais" class="form-label">País</label>
            <input type="text" class="form-control" id="pais" name="pais" required>
        </div>

        <!-- Grupo (Menú desplegable dinámico basado en Enum) -->
        <div class="mb-3">
            <label for="grupo" class="form-label">Grupo</label>
            <select class="form-select" id="grupo" name="grupo" required>
                <option value="" disabled selected>Seleccione un grupo</option>
                {% for grupo in Grupos %}
                    <option value="{{ grupo.value|upper }}">Grupo {{ grupo.value|upper }}</option>
                {% endfor %}
            </select>
            <div class="invalid-feedback">Por favor, selecciona un grupo.</div>
        </div>

        <!-- Puntos -->
        <div class="mb-3">
            <label for="puntos" class="form-label">Puntos</label>
            <input type="number" class="form-control" id="puntos" name="puntos" required min="0" value="0">
            <div class="invalid-feedback">Por favor, ingresa los puntos.</div>
        </div>

        <!-- Logo -->
        <div class="mb-3">
            <label for="logo" class="form-label">Logo del equipo</label>
            <input type="file" class="form-control" id="logo" name="logo" accept=".png,.jpg,.jpeg" required>
            <div class="invalid-feedback">Por favor, selecciona un logo.</div>
        </div>

        <!-- Estado -->
        <div class="mb-3">
            <label for="esta_activo" class="form-label">Estado del equipo</label>
            <select class="form-select" id="esta_activo" name="esta_activo" required>
                <option value="true" selected>Activo</option>
                <option value="false">Inactivo</option>
            </select>
        </div>

        <!-- Botón -->
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Registrar equipo</button>
        </div>
    </form>
</div>
{% endblock %}
